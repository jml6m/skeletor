# Lychee link-checker config. See https://lychee.cli.rs/usage/config/ for full schema.

# Fragments (anchors + text fragments). String enum matches lychee 0.24.x, pinned via
# lycheeVersion in .github/workflows/docs-lint.yml.
include_fragments = "full"
accept = [200, 206, 429]
max_concurrency = 8
max_retries = 2
retry_wait_time = 3
timeout = 20

# Add repo-specific build/generated dirs here as the project grows.
exclude_path = [
  "node_modules",
  "dist",
  "coverage",
  "lib",
]

# Version-agnostic regex excludes. Add repo-specific URL patterns as needed.
exclude = [
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://(www\.)?npmjs\.(com|org)',   # npmjs 403s automated clients
]
