# Dependabot — grouped, monthly, single-PR baseline.
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
# multi-ecosystem-group requires patterns on each updates entry.
# open-pull-requests-limit must live on the multi-ecosystem group (not on updates).
# No `labels:` — Dependabot creates and applies its default labels (e.g. `dependencies`) itself,
# whereas a named label that doesn't exist yet in a fresh repo is silently ignored.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    assignees:
      - "{{REPO_OWNER}}"

updates:
  - package-ecosystem: "{{DEPENDABOT_ECOSYSTEM}}"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"{{DEPENDABOT_IGNORE}}

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
