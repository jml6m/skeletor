name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: {{PIN_ACTION_CHECKOUT}}
      - uses: {{PIN_ACTION_SETUP_NODE}}
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Packs (prepack builds lib/) and checks the exports map; npm publish then runs prepublishOnly.
      - run: npm run check:package
      - run: npm publish --provenance --access public