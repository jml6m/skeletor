name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same checks as the CI workflow, so nothing is published that CI would reject.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: {{PIN_ACTION_CHECKOUT}}
      - uses: {{PIN_ACTION_SETUP_NODE}}
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
{{CI_CHECK_STEPS}}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: {{PIN_ACTION_CHECKOUT}}
      - uses: {{PIN_ACTION_SETUP_NODE}}
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # npm publish builds lib/ (prepack) and runs prepublishOnly first.
      - run: npm publish --provenance --access public
