name: Docs Policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Enforce markdown allowlist
        run: bash .github/scripts/check-docs-policy.sh
