name: Epic (Parent Issue)
description: Track a larger feature or initiative that spans multiple sub-issues.
title: "[Epic]: "
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🧭 Epic Guidelines (For Agents & Developers)
        - **When to use:** Use an Epic when the work naturally breaks down into several distinct sub-issues, or spans multiple templates / the generator / docs.
        - **How to use:**
          1. Create this Parent Epic first.
          2. Add each child issue (one per template / per CLI surface area / per doc, etc.) as a native sub-issue, from the epic's **Sub-issues** panel or with:

             ```bash
             gh issue create --parent <epic-number> --title "..." --body "..."
             ```

             GitHub tracks progress (e.g., 3 / 6) from the sub-issues; don't list them as a checklist here.
        - An epic always has **at least one sub-issue**.
        - **Anti-pattern:** Do not open an Epic for a single-file change or a single-template tweak — file a regular Feature Request or Bug Report instead.
  - type: textarea
    id: description
    attributes:
      label: Epic Description
      description: What is the high-level goal of this epic? Which templates / generator surfaces does it touch?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Templates, generator surfaces, docs, and infra in scope. Anything explicitly out of scope.
      placeholder: |
        In scope:
          - templates/javascript, templates/typescript
          - src/index.js (manifest loader)
        Out of scope:
          - templates/python, templates/rust
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria (Epic-level)
      description: "When can this Epic be closed? (Usually: all sub-issues closed AND a final integration verification.)"
      value: |
        - [ ] All sub-issues closed
        - [ ] `npm test` passes
        - [ ] For each touched template, `skeletor new` + that template's `verifyCommands` succeeds
    validations:
      required: false
