name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Preflight (tag ↔ version, not already published)
        run: node scripts/publish-preflight.mjs

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm CLI 10 (shipped with Node 20) does not fully support Trusted
      # Publishing OIDC; upgrade to 11.5.1+ before publishing.
      - name: Ensure npm 11.5.1+ for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Release gates
        run: npm run lint:encoding && npm run audit:ci && npm test

      - name: Verify npm Trusted Publishing auth (dry-run)
        run: node scripts/verify-npm-publish-auth.mjs

      - name: Resolve npm dist-tag
        id: disttag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            PRE=${VERSION#*-}
            echo "tag=${PRE%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Gates already ran above; skip prepublishOnly to avoid a second full test run.
      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }} --ignore-scripts

      - name: Remove stale prerelease dist-tags on stable publish
        run: node scripts/npm-dist-tag-hygiene.mjs