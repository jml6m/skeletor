name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm CLI 10 (shipped with Node 20) does not fully support Trusted
      # Publishing OIDC; upgrade to 11.5.1+ before publishing.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - name: Resolve npm dist-tag
        id: disttag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            PRE=${VERSION#*-}
            echo "tag=${PRE%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}
