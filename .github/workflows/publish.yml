name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight (tag ↔ version, not already published)
        run: node scripts/publish-preflight.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - run: npm ci

      - name: Lint, audit, unit tests, and template verifyCommands
        run: npm run lint:encoding && npm run audit:ci && npm test && npm run test:verify

  publish:
    needs: release-gates
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm CLI 10 (shipped with Node 20) does not fully support Trusted
      # Publishing OIDC; upgrade to 11.5.1+ before publishing.
      - name: Ensure npm 11.5.1+ for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Verify npm Trusted Publishing auth (dry-run)
        run: node scripts/verify-npm-publish-auth.mjs

      - name: Resolve npm dist-tag
        id: disttag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            PRE=${VERSION#*-}
            echo "tag=${PRE%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }} --ignore-scripts

      - name: Remove stale prerelease dist-tags on stable publish
        run: node scripts/npm-dist-tag-hygiene.mjs