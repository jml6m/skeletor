# Dependabot: one grouped monthly PR for npm and GitHub Actions updates.
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
# multi-ecosystem-group requires patterns on each updates entry.
# open-pull-requests-limit must live on the multi-ecosystem group (not on updates).
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
    assignees:
      - 'jml6m'

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'all-dependencies'
    versioning-strategy: 'increase'
    ignore:
      # Held at 5.x: madge's peer dependency rejects 6, and 7 breaks madge.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Tracks the lowest Node version in engines, not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'all-dependencies'
