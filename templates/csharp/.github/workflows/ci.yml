name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: {{PIN_ACTION_CHECKOUT}}

      - name: Setup .NET
        uses: {{PIN_ACTION_SETUP_DOTNET}}
        with:
          dotnet-version: '{{PIN_RUNTIME_DOTNET}}.x'

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test