name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # A pull request's checks gate the merge, so nothing re-runs after it; this runs them by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Maven adds MAVEN_ARGS to every mvn command: no colors or download progress in the log.
      MAVEN_ARGS: --batch-mode
    steps:
      - name: Checkout
        uses: {{PIN_ACTION_CHECKOUT}}

      - name: Setup Java
        uses: {{PIN_ACTION_SETUP_JAVA}}
        with:
          distribution: temurin
          java-version: '{{PIN_RUNTIME_JAVA}}'

{{CI_CHECK_STEPS}}
