name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: {{PIN_ACTION_CHECKOUT}}

      - name: Setup Java
        uses: {{PIN_ACTION_SETUP_JAVA}}
        with:
          distribution: temurin
          java-version: '{{PIN_RUNTIME_JAVA}}'

      - name: Maven compile
        run: mvn -B clean compile

      - name: Maven test
        run: mvn -B test