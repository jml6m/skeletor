name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # A pull request's checks gate the merge, so nothing re-runs after it; this runs them by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: {{PIN_ACTION_CHECKOUT}}

      # uv installs the Python version in .python-version.
      - name: Setup uv
        uses: {{PIN_ACTION_SETUP_UV}}

      - name: Install dependencies
        # --locked fails when uv.lock is out of step with pyproject.toml. Until uv.lock is
        # committed (the first push can come before the first `uv sync`), uv resolves fresh.
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else uv sync; fi

{{CI_CHECK_STEPS}}
