name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: {{PIN_ACTION_CHECKOUT}}

      # uv installs the Python version in .python-version.
      - name: Setup uv
        uses: {{PIN_ACTION_SETUP_UV}}

      - name: Install dependencies
        # --locked fails when uv.lock is out of step with pyproject.toml. Until uv.lock is
        # committed (the first push can come before the first `uv sync`), uv resolves fresh.
        run: |
          if [ -f uv.lock ]; then uv sync --locked; else uv sync; fi

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

      - name: Mypy
        run: uv run mypy src
