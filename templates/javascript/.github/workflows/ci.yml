name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # A pull request's checks gate the merge, so nothing re-runs after it; this runs them by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: {{PIN_ACTION_CHECKOUT}}

      - name: Setup Node.js
        uses: {{PIN_ACTION_SETUP_NODE}}
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

{{CI_CHECK_STEPS}}
